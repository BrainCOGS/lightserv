# Static server for one Neuroglancer "precomputed" volume mounted read-only at /mnt/data.
# Runs as the unprivileged nginx user, so it listens on 1337 (>1024) and keeps
# every writable path under /tmp (mount a tmpfs there when using --read-only).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    # Chunks, shards and compressed files are all opaque bytes.
    types { }
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # cloud-files stores compressed chunks as <name>.gz / .br / .zstd but
    # Neuroglancer asks for <name>. Serve the file as-is and label it, so the
    # browser decodes it. After try_files rewrites the URI, $uri has the suffix.
    map $uri $content_encoding {
        default   "";
        ~\.gz$    gzip;
        ~\.br$    br;
        ~\.zstd$  zstd;
    }

    server {
        listen 1337 default_server;
        server_name _;
        root /mnt/data;
        autoindex off;

        # Headers are set only at server level so every location inherits them.
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Content-Encoding" always;
        add_header Access-Control-Max-Age        86400 always;
        add_header Content-Encoding              $content_encoding;   # empty value = header omitted

        # Read-only service.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        if ($request_method = OPTIONS)               { return 204; }

        # No directory listings, no dotfiles.
        location ~ /$    { return 404; }
        location ~ /\.   { return 404; }

        # Metadata files are JSON.
        location ~ (^|/)(info|provenance)(\.gz|\.br|\.zstd)?$ {
            default_type application/json;
            try_files $uri $uri.gz $uri.br $uri.zstd =404;
        }

        location / {
            try_files $uri $uri.gz $uri.br $uri.zstd =404;
        }
    }
}
